<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Contract Clause Sentry</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔍 Contract Clause Sentry</h1><p>Scan contract text for clause-level risks.</p><textarea id="t" rows="6" placeholder="Paste contract excerpt..."></textarea><br><button onclick="go()">Scan</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value.toLowerCase();const checks={'Unlimited liability':/unlimited liability/,'Auto-renewal w/o notice':/auto(omatic)? renewal|renews automatically/,'Broad IP assignment':/assigns all|intellectual property.*assign/,'Missing termination rights':/perpetual|in perpetuity/,'Uncapped indemnity':/indemnify.*(all|any)|hold harmless/};let hits=[];for(const[k,re]of Object.entries(checks))if(re.test(t))hits.push('🔴 '+k);document.getElementById('out').textContent=(hits.length?hits.join('\n'):'🟢 No high-risk clause patterns found')+'\n\nClause-level heatmap with benchmarks: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/contract-clause-sentry">GitHub</a> · <a href="https://ziontechgroup.com/contract-redline-copilot/">Redline Copilot</a></p></body></html>
